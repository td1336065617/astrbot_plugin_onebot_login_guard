<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OneBot 登录守护</title>
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1f2328; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 600; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; }
  .badge.online { background: #dcfce7; color: #166534; }
  .badge.need_login { background: #fef3c7; color: #92400e; }
  .badge.offline { background: #fee2e2; color: #991b1b; }
  .badge.unknown { background: #e5e7eb; color: #374151; }
  .detail { color: #6b7280; font-size: 12px; margin-top: 6px; word-break: break-all; }
  .qr { margin-top: 10px; text-align: center; }
  .qr img { width: 180px; height: 180px; image-rendering: pixelated; border: 1px solid #e5e7eb; border-radius: 8px; background: #fff; }
  .actions { margin: 16px 0; display: flex; gap: 8px; flex-wrap: wrap; }
  button { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  button:hover { background: #f3f4f6; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #f1f3f5; font-size: 13px; }
  th { background: #fafafa; color: #6b7280; font-weight: 500; }
  .muted { color: #9ca3af; }
  #msg { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: #eef6ff; color: #1f4e79; font-size: 13px; white-space: pre-wrap; }
  #msg.err { background: #fdecec; color: #8a1f1f; }
</style>
</head>
<body>
  <h1>🔐 OneBot 登录守护</h1>
  <div class="sub" id="sub">正在加载…</div>
  <div id="msg" hidden></div>

  <div class="actions">
    <button id="btn-probe">立即探测</button>
    <button id="btn-test">测试通知</button>
    <button id="btn-refresh-qr">刷新二维码</button>
    <button id="btn-discover">自动识别协议端</button>
  </div>

  <div class="cards" id="cards"></div>

  <h2 style="font-size:16px;margin:24px 0 8px;">最近事件</h2>
  <table>
    <thead><tr><th>时间</th><th>实例</th><th>事件</th><th>渠道结果</th></tr></thead>
    <tbody id="events"></tbody>
  </table>

<script>
(function () {
  var api = window.AstrBotPluginPage;

  function esc(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function show(text, ok) {
    var box = document.getElementById("msg");
    if (!box) return;
    box.textContent = String(text || "");
    box.className = ok ? "" : "err";
    box.hidden = false;
    clearTimeout(show._t);
    show._t = setTimeout(function () { box.hidden = true; }, 6000);
  }

  function call(path, method, params, body) {
    if (api && typeof api.apiGet === "function") {
      return method === "GET" ? api.apiGet(path, params || {}) : api.apiPost(path, body || {});
    }
    var url = path;
    if (method === "GET" && params && Object.keys(params).length) {
      url += "?" + new URLSearchParams(params).toString();
    }
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: method === "GET" ? undefined : JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); });
  }

  function fmtTime(ts) {
    if (!ts) return "—";
    var d = new Date(ts * 1000);
    return d.toLocaleString();
  }

  function renderCards(instances) {
    var box = document.getElementById("cards");
    box.innerHTML = "";
    if (!instances || !instances.length) {
      box.innerHTML = '<div class="card muted">未配置被守护实例</div>';
      return;
    }
    instances.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="row"><span class="name">' + esc(item.instance_id) + '</span>' +
        '<span class="badge ' + esc(item.state) + '">' + esc(item.state_label) + '</span></div>' +
        '<div class="detail">' + esc(item.detail || "—") + '</div>' +
        (item.qr_stale ? '<div class="detail">⚠️ 二维码已过期，协议端刷新后会自动推送</div>' : "") +
        '<div class="detail">来源：' + esc(item.source || "—") +
        ' · 探测：' + esc(fmtTime(item.last_probe_ts)) + '</div>' +
        (item.qr_url ? '<div class="detail">解码链接：' + esc(item.qr_url) + '</div>' : "") +
        '<div class="qr"></div>';
      box.appendChild(card);
      if (item.has_qr) {
        call("qr_data", "GET", { instance_id: item.instance_id })
          .then(function (res) {
            var url = res && res.data_url;
            if (!url) return;
            var img = document.createElement("img");
            img.src = url;
            img.alt = "二维码";
            card.querySelector(".qr").appendChild(img);
          })
          .catch(function () {
            card.querySelector(".qr").textContent = "暂无可用二维码";
          });
      }
    });
  }

  function renderEvents(events) {
    var body = document.getElementById("events");
    body.innerHTML = "";
    if (!events || !events.length) {
      body.innerHTML = '<tr><td colspan="4" class="muted">暂无事件</td></tr>';
      return;
    }
    events.forEach(function (item) {
      var ev = item.event || {};
      var notes = (item.notifications || []).map(function (n) {
        return n.channel + (n.ok ? " ✓" : " ✗");
      }).join("、") || "无渠道";
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(fmtTime(ev.ts)) + "</td>" +
        "<td>" + esc(ev.instance_id || "—") + "</td>" +
        "<td>" + esc(ev.kind_label || ev.kind || "—") + "</td>" +
        "<td>" + esc(notes) + "</td>";
      body.appendChild(tr);
    });
  }

  function refresh() {
    return call("status", "GET").then(function (res) {
      var data = res || {};
      document.getElementById("sub").textContent =
        "轮询间隔 " + (data.poll_interval || "-") + "s · 渠道：" +
        ((data.channels || []).join("、") || "未配置");
      renderCards(data.instances || []);
      renderEvents(data.events || []);
    });
  }

  document.getElementById("btn-probe").onclick = function () {
    call("probe", "POST").then(refresh).catch(function (err) {
      show("探测失败：" + (err && err.message ? err.message : err), false);
    });
  };

  document.getElementById("btn-test").onclick = function () {
    call("test_notify", "POST")
      .then(function (res) {
        show("已发送测试通知：" + ((res && res.channels) || []).join("、"), true);
        return refresh();
      })
      .catch(function (err) {
        show("测试通知失败：" + (err && err.message ? err.message : err), false);
      });
  };

  document.getElementById("btn-refresh-qr").onclick = function () {
    call("refresh_qr", "POST", null, {})
      .then(function (res) {
        show(
          res && res.refreshed
            ? "已向协议端申请一张全新二维码并推送"
            : "已推送当前二维码，但没能让协议端重新出码（检查 WebUI 地址与 token）",
          !!(res && res.refreshed)
        );
        return refresh();
      })
      .catch(function (err) {
        show("刷新失败：" + (err && err.message ? err.message : err), false);
      });
  };

  document.getElementById("btn-discover").onclick = function () {
    call("apply_discovery", "POST", null, {})
      .then(function (res) {
        var d = res || {};
        var lines = [
          "二维码：" + (d.qr_path || "未找到"),
          "日志：" + (d.log_path || "未找到"),
          "WebUI：" + (d.http_url || "未找到"),
          "",
        ].concat(d.notes || []);
        show(lines.join("\n"), true);
        return refresh();
      })
      .catch(function (err) {
        show("自动识别失败：" + (err && err.message ? err.message : err), false);
      });
  };

  if (api && typeof api.ready === "function") {
    api.ready().then(refresh).catch(function (err) {
      show("桥接初始化失败：" + (err && err.message ? err.message : err), false);
    });
  } else {
    show("未检测到 AstrBot 插件页桥接（bridge-sdk），无法访问后端接口", false);
  }
})();
</script>
</body>
</html>
